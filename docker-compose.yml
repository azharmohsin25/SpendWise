services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: spendwise
      MYSQL_USER: spendwise
      MYSQL_PASSWORD: spendwise
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - spendwise-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pspendwise"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/spendwise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: spendwise
      DB_PASSWORD: spendwise
      JWT_SECRET: local-spendwise-jwt-secret-change-before-deploy-2026
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  spendwise-mysql:
