o-axis-label{position:absolute;left:50%;bottom:7px;z-index:2;display:flex;align-items:center;gap:7px;color:#637e76;font-size:6px;font-weight:750;letter-spacing:1px;white-space:nowrap;transform:translateX(-50%)}.demo-axis-label span{color:#81eac0;font-size:8px}.demo-axis-label i{width:15px;height:1px;background:linear-gradient(90deg,#48d6a788,transparent)}

  <body>
    <div id="root"></div>
    <script>
      (()=>{
        if(location.protocol!=='file:')return;
        const key='spendwise-direct-demo-v1';
        const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
        const monthStart=()=>today().slice(0,7)+'-01';
        const initial=()=>({balance:284500,reserve:185000,income:125000,expenses:68400,emi:18400,credit:23750,entries:[{id:1,name:'Monthly salary',category:'Income',type:'income',amount:125000,date:monthStart()},{id:2,name:'Rent · Koramangala',category:'Housing',type:'expense',amount:26500,date:monthStart()},{id:3,name:'Food & dining',category:'Food & dining',type:'expense',amount:14200,date:today()},{id:4,name:'Transport',category:'Transport',type:'expense',amount:8600,date:today()},{id:5,name:'Lifestyle',category:'Lifestyle',type:'expense',amount:11200,date:today()},{id:6,name:'Other expenses',category:'Other',type:'expense',amount:7900,date:today()}],goals:[{id:1,name:'Emergency fund',saved:185000,target:300000,due:'Mar 2027'},{id:2,name:'Japan trip',saved:64000,target:120000,due:'Jun 2027'},{id:3,name:'New MacBook',saved:48000,target:150000,due:'Aug 2027'}],budgets:[{category:'Food & dining',limit:18000},{category:'Transport',limit:12000},{category:'Lifestyle',limit:14000}],plans:[],simulations:[],cards:[{name:'SpendWise Visa',lastFour:'4928',limit:100000,outstanding:23750,due:'2026-11-20'}]});
        let data;try{data=JSON.parse(localStorage.getItem(key)||'null')||initial()}catch{data=initial()};let page='overview',toastTimer;
        const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch{}};
        const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const cash=(n)=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0);
        const monthTotals=()=>{const m=today().slice(0,7),rows=data.entries.filter(x=>(x.date||'').startsWith(m));return {income:rows.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),expenses:rows.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0)}};
        const calcEmi=(p,r,n)=>{p=Math.max(0,Number(p)||0);n=Math.max(1,Number(n)||1);r=Math.max(0,Number(r)||0)/1200;const payment=r===0?p/n:p*r*(1+r)**n/((1+r)**n-1);return {payment,total:payment*n,interest:payment*n-p}};
        const calcPurchase=(x)=>{const surplus=Number(x.income)-Number(x.expenses)-Number(x.emi)-Number(x.credit),projected=Number(x.balance)+surplus*Number(x.months),after=projected-Number(x.price),target=Number(x.expenses)*3,reserve=Math.max(0,Number(x.reserve)+after),cover=Number(x.expenses)>0?reserve/Number(x.expenses):99;let score=after>=0?30:0;score+=reserve>=target?35:target>0?Math.round(35*reserve/target):35;if(surplus>0)score+=20;if(surplus>=Number(x.price)/3)score+=15;score=Math.min(100,score);const status=after<0||surplus<=0?'Not recommended':score>=75?'Affordable':'Risky';const explanation=status==='Affordable'?`Your cash and dedicated emergency savings still cover about ${cover.toFixed(1)} months of expenses after this purchase.`:status==='Risky'?`This purchase may leave about ${cover.toFixed(1)} months of expenses in reserve. Consider waiting or choosing a lower price.`:surplus<=0?'Your monthly commitments use all of your income. Adding this purchase could increase financial pressure.':`The purchase exceeds projected cash by ${cash(Math.abs(after))}. Saving first would reduce the risk.`;return {surplus,projected,after,target,reserve,cover,score,status,explanation}};
        const navItems=[['overview','⌂','Overview'],['simulator','◉','Purchase simulator'],['emi','▤','EMI planner'],['activity','↕','Transactions & budgets'],['goals','◎','Savings goals']];
        const headerTitle={overview:'Your money, in focus',simulator:'Purchase simulator',emi:'EMI planner',activity:'Transactions & budgets',goals:'Savings goals'};
        const metric=(label,value,sub)=>`<article class="metric"><label>${label}</label><strong>${value}</strong><small>${sub}</small></article>`;
        const chart=()=>{const vals=[.68,.77,.72,.84,.82,.91];return `<div class="bars">${vals.map((v,i)=>`<div class="bar-group"><i class="bar" style="height:${v*85}%"></i><i class="bar expense" style="height:${(v*(.57+i%2*.08))*85}%"></i><i class="bar saving" style="height:${(v*.39)*85}%"></i><small class="bar-label">${['Jun','Jul','Aug','Sep','Oct','Nov'][i]}</small></div>`).join('')}</div>`};
        const overview=()=>{const m=monthTotals(),rate=m.income?Math.round((m.income-m.expenses)/m.income*100):0,cats={};data.entries.filter(x=>x.type==='expense'&&(x.date||'').startsWith(today().slice(0,7))).forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<section class="spatial-demo"><div class="spatial-demo-head"><div><div class="spatial-kicker"><i></i> FINANCIAL COMMAND SPACE</div><h2>Your Money. <em>Your Space.</em> Your Control.</h2><p>A live model of your financial world. Select a signal to explore.</p></div><span class="spatial-status"><i></i> PRIVATE DEMO</span></div><div class="spatial-demo-stage"><div class="demo-orbit demo-orbit-a"></div><div class="demo-orbit demo-orbit-b"></div><div class="demo-sphere" aria-hidden="true"><div class="demo-sphere-core"></div></div><div class="demo-core-readout"><small>AVAILABLE BALANCE</small><strong>${cash(data.balance)}</strong><i><b></b> PRIVATE · LOCAL DATA</i></div><button class="demo-signal signal-income" data-page="activity"><span class="signal-icon">↙</span><span><small>MONTHLY INCOME</small><strong>${cash(m.income)}</strong><i>recorded inflow</i></span><b>→</b></button><button class="demo-signal signal-expenses" data-page="activity"><span class="signal-icon cyan">↗</span><span><small>MONTHLY OUTFLOW</small><strong>${cash(m.expenses)}</strong><i>recorded spend</i></span><b>→</b></button><button class="demo-signal signal-savings" data-page="goals"><span class="signal-icon violet">◌</span><span><small>NET SAVINGS</small><strong>${cash(m.income-m.expenses)}</strong><i>this month</i></span><b>→</b></button><button class="demo-signal signal-investments" data-page="activity"><span class="signal-icon gold">◇</span><span><small>INVESTED THIS MONTH</small><strong>${cash(catRows.filter(([name])=>/invest|mutual fund|stocks?|sip/i.test(name)).reduce((sum,row)=>sum+row[1],0))}</strong><i>recorded categories</i></span><b>→</b></button><div class="demo-axis-label"><span>01</span> CASH FLOW <i></i> <span>02</span> SAVINGS <i></i> <span>03</span> NEXT MOVE</div></div><div class="spatial-demo-foot"><span>◈ Your numbers stay in this browser</span><button class="spatial-demo-cta" data-page="simulator">Simulate a purchase <b>→</b></button><span>Card obligations ${cash(data.cards.reduce((a,c)=>a+Number(c.outstanding),0))}</span></div></section><div class="obligations"><div><span>Monthly EMI commitments</span><b>${cash(data.plans.reduce((a,p)=>a+Number(p.payment||0),0)+Number(data.emi))}</b></div><div><span>Credit card outstanding</span><b>${cash(data.cards.reduce((a,c)=>a+Number(c.outstanding),0))}</b></div><a href="#" data-page="emi">View payments →</a></div><section class="grid2"><article class="panel"><div class="panel-head"><div><div class="kicker">CASH FLOW</div><h2>Income, spending & savings</h2><p>Sample six-month trend</p></div><span class="period">Last 6 months</span></div><div class="legend"><span><i></i>Income</span><span><i></i>Expenses</span><span><i></i>Net savings</span></div>${chart()}<div class="chart-legend"><span>Demo chart for visual preview</span><span>${cash(m.income-m.expenses)} net this month</span></div></article><article class="panel"><div class="kicker">SPENDING BREAKDOWN</div><h2>Where it goes</h2><p>This month’s expense records</p><div class="category-list">${catRows.map(([name,amount],i)=>`<div class="cat-row"><span class="cat-name"><i class="dot" style="--c:${['#10b981','#22d3ee','#8b7cf6','#f3a95f','#66736c'][i]}"></i>${esc(name)}</span><span>${cash(amount)}</span><small>${Math.round(amount/(m.expenses||1)*100)}%</small></div>`).join('')||'<div class="empty">Add transactions to see your spending breakdown.</div>'}</div></article></section><section class="panel section"><div class="panel-head"><div><div class="kicker">RECENT ACTIVITY</div><h2>Your latest moves</h2></div><button class="button secondary" data-page="activity">All activity</button></div>${activityRows(data.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4))}</section>${data.simulations.length?`<section class="panel section"><div class="kicker">PURCHASE HISTORY</div><h2>Past decisions</h2>${data.simulations.slice(0,5).map(s=>`<div class="activity-row"><div class="activity-icon">◉</div><div class="activity-copy"><b>${esc(s.product)}</b><small>${esc(s.status)} · Score ${s.score}/100</small></div><strong>${cash(s.price)}</strong><span></span></div>`).join('')}</section>`:''}`};
        const activityRows=(rows)=>`<div class="activity-list">${rows.length?rows.map(r=>`<div class="activity-row"><div class="activity-icon ${r.type==='expense'?'expense':''}">${r.type==='income'?'↘':'↗'}</div><div class="activity-copy"><b>${esc(r.name)}</b><small>${esc(r.category)} · ${esc(r.date)}</small></div><strong class="amount ${r.type==='expense'?'negative':''}">${r.type==='income'?'+':'−'}${cash(r.amount)}</strong><span class="activity-date">${esc(r.date)}</span></div>`).join(''):'<div class="empty">No entries yet.</div>'}</div>`;
        const simulator=()=>{const x=data.simDraft||{product:'MacBook Pro 14”',price:199900,balance:data.balance,reserve:data.reserve,income:data.income,expenses:data.expenses,emi:data.plans.reduce((a,p)=>a+Number(p.payment||0),0)+Number(data.emi),credit:data.credit,months:0},r=calcPurchase(x);data.simDraft=x;return `<h2 class="page-title">Think it through, before you buy.</h2><div class="sim-grid"><section class="panel"><div class="kicker">YOUR PURCHASE</div><h2>Bring your real numbers.</h2><p>Estimates use figures you enter here. SpendWise does not connect to a bank.</p><form id="sim-form"><div class="form-grid section"><div class="field full"><label>Product or purchase</label><input name="product" value="${esc(x.product)}"></div><div class="field"><label>Price</label><input name="price" type="number" min="0" value="${x.price}"></div><div class="field"><label>Purchase in (months)</label><input name="months" type="number" min="0" max="24" value="${x.months}"></div><div class="field"><label>Available balance, excluding reserve</label><input name="balance" type="number" min="0" value="${x.balance}"></div><div class="field"><label>Emergency savings</label><input name="reserve" type="number" min="0" value="${x.reserve}"></div><div class="field"><label>Monthly income</label><input name="income" type="number" min="0" value="${x.income}"></div><div class="field"><label>Monthly expenses</label><input name="expenses" type="number" min="0" value="${x.expenses}"></div><div class="field"><label>Monthly EMI payments</label><input name="emi" type="number" min="0" value="${x.emi}"></div><div class="field"><label>Monthly card / other debt payments</label><input name="credit" type="number" min="0" value="${x.credit}"></div></div><p class="disclaimer">A planning estimate from your entries, not a bank balance verification or financial advice.</p><button type="submit" class="button">Save this simulation</button></form></section><aside><div id="sim-result" class="panel">${purchaseResult(r)}</div><div class="notice">Try a different purchase date. Saving for a few months can change the result.</div></aside></div>`};
        const purchaseResult=(r)=>`<div class="result" style="--green:${r.status==='Affordable'?'#10b981':r.status==='Risky'?'#f3a95f':'#fb7185'}"><div class="score"><strong>${r.score}</strong></div><div><div class="kicker">AFFORDABILITY SCORE</div><h2>${r.status}</h2><p>${r.explanation}</p></div></div><div class="result-stats"><div class="result-stat"><span>Monthly disposable income</span><b>${cash(r.surplus)}</b></div><div class="result-stat"><span>Projected cash at purchase</span><b>${cash(r.projected)}</b></div><div class="result-stat"><span>Cash after purchase</span><b>${cash(r.after)}</b></div><div class="result-stat"><span>Reserve cover after purchase</span><b>${r.cover.toFixed(1)} months</b></div><div class="result-stat"><span>Suggested emergency reserve</span><b>${cash(r.target)}</b></div><div class="result-stat"><span>Financial recovery time</span><b>${r.surplus>0?Math.ceil(Number(data.simDraft.price)/r.surplus)+' months':'—'}</b></div></div><p class="disclaimer">Emergency savings are counted separately from your available balance.</p>`;
        const emi=()=>{const d=data.emiDraft||{price:180000,down:30000,rate:12.5,months:12},r=calcEmi(Math.max(0,d.price-d.down),d.rate,d.months);data.emiDraft=d;return `<h2 class="page-title">Make the EMI math make sense.</h2><div class="emi-grid"><section class="panel"><div class="kicker">EMI PLANNER</div><h2>Compare monthly comfort with total cost.</h2><div class="form-grid section" id="emi-form"><div class="field"><label>Purchase price</label><input name="price" type="number" min="0" value="${d.price}"></div><div class="field"><label>Down payment</label><input name="down" type="number" min="0" value="${d.down}"></div><div class="field"><label>Annual interest rate (%)</label><input name="rate" type="number" min="0" step="0.1" value="${d.rate}"></div><div class="field"><label>Loan duration</label><select name="months">${[6,12,18,24,36,48,60].map(n=>`<option value="${n}" ${Number(d.months)===n?'selected':''}>${n} months</option>`).join('')}</select></div></div><div id="emi-live">${emiResult(r,Math.max(0,d.price-d.down))}</div></section><aside class="panel"><div class="kicker">SAVE AN ACTIVE EMI</div><h2>Your next commitment</h2><form id="plan-form" class="section"><div class="field"><label>Purchase or loan</label><input name="label" placeholder="e.g. Laptop financing" required></div><div class="field section"><label>Next payment date</label><input name="date" type="date"></div><button class="button section" type="submit">Save EMI plan</button></form>${data.plans.length?`<div class="section">${data.plans.map(p=>`<div class="activity-row"><div class="activity-icon">▤</div><div class="activity-copy"><b>${esc(p.label)}</b><small>${p.months} months · Next ${esc(p.date||'date not set')}</small></div><strong>${cash(p.payment)}</strong><span></span></div>`).join('')}</div>`:'<div class="empty">No active EMI plans saved.</div>'}</aside></div><p class="disclaimer">Reducing-balance estimate; lender fees, taxes, and changing rates are not included.</p>`};
        const emiResult=(r,principal)=>`<div class="emi-result"><span>Estimated monthly EMI</span><strong>${cash(r.payment)}</strong><div class="result-stats"><div class="result-stat"><span>Financed principal</span><b>${cash(principal)}</b></div><div class="result-stat"><span>Total interest</span><b>${cash(Math.max(0,r.interest))}</b></div><div class="result-stat"><span>Total repayment</span><b>${cash(r.total)}</b></div></div><div class="kicker">TENURE COMPARISON</div><div class="compare-bars">${[6,12,18,24,36].map(n=>{const q=calcEmi(principal,data.emiDraft.rate,n);return `<div class="compare-col"><i style="height:${Math.max(12,Math.min(118,q.payment/Math.max(1,r.payment)*70))}px"></i><small>${n} mo · ${cash(q.payment)}</small></div>`}).join('')}</div></div>`;
        const activity=()=>{const m=monthTotals();return `<h2 class="page-title">Transactions & monthly budgets</h2><section class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric('Income this month',cash(m.income),'Recorded entries')}${metric('Expenses this month',cash(m.expenses),'Recorded entries')}${metric('Net saved',cash(m.income-m.expenses),'Income less expenses')}</section><section class="panel section"><div class="kicker">ADD A RECORD</div><h2>Track an income or expense</h2><form id="entry-form" class="quick-form"><div class="field"><label>Description</label><input name="name" placeholder="e.g. Groceries" required></div><div class="field"><label>Type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="field"><label>Category</label><input name="category" placeholder="e.g. Food & dining" value="Other"></div><div class="field"><label>Amount</label><input name="amount" type="number" min="1" placeholder="0" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><button class="button" type="submit">Add entry</button></form><div class="table-wrap"><table><thead><tr><th>DESCRIPTION</th><th>CATEGORY</th><th>DATE</th><th>AMOUNT</th><th></th></tr></thead><tbody>${data.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.category)}</td><td>${esc(r.date)}</td><td class="${r.type==='income'?'type-income':''}">${r.type==='income'?'+':'−'}${cash(r.amount)}</td><td><button class="delete" data-delete-entry="${r.id}">Delete</button></td></tr>`).join('')}</tbody></table></div></section><section class="panel section"><div class="kicker">MONTHLY GUARDRAILS</div><h2>Category budgets</h2><form id="budget-form" class="quick-form"><div class="field"><label>Category</label><input name="category" placeholder="Food & dining" required></div><div class="field"><label>Monthly limit</label><input name="limit" type="number" min="1" required></div><button class="button" type="submit">Save budget</button></form><div class="budget-grid">${data.budgets.map(b=>{const spent=data.entries.filter(e=>e.type==='expense'&&e.category.toLowerCase()===b.category.toLowerCase()&&(e.date||'').startsWith(today().slice(0,7))).reduce((a,e)=>a+Number(e.amount),0);return `<div class="budget-card"><div class="budget-card-top"><b>${esc(b.category)}</b><span>${cash(spent)} / ${cash(b.limit)}</span></div><div class="progress"><i style="width:${Math.min(100,spent/b.limit*100)}%;background:${spent>b.limit?'#fb7185':''}"></i></div></div>`}).join('')}</div></section><section class="panel section"><div class="kicker">CREDIT CARD</div><h2>Card balance and payment date</h2><div class="budget-grid">${data.cards.map(c=>`<div class="budget-card"><div class="budget-card-top"><b>${esc(c.name)} ···· ${esc(c.lastFour)}</b><span>${Math.round(c.outstanding/c.limit*100)}% used</span></div><p>${cash(c.outstanding)} outstanding of ${cash(c.limit)}</p><div class="progress"><i style="width:${Math.min(100,c.outstanding/c.limit*100)}%"></i></div><small>Payment date: ${esc(c.due||'not set')}</small></div>`).join('')}</div><form id="card-form" class="quick-form"><div class="field"><label>Card name</label><input name="name" placeholder="Travel rewards" required></div><div class="field"><label>Last four</label><input name="lastFour" inputmode="numeric" maxlength="4" required></div><div class="field"><label>Credit limit</label><input name="limit" type="number" min="1" required></div><div class="field"><label>Outstanding</label><input name="outstanding" type="number" min="0" value="0" required></div><div class="field"><label>Due date</label><input name="due" type="date"></div><button class="button" type="submit">Add card</button></form></section>`};
        const goals=()=>`<div class="panel"><div class="kicker">THE FUTURE, IN FOCUS</div><h2>Every goal starts with one good choice.</h2><p>Demo goals are saved in this browser.</p></div><form id="goal-form" class="panel section quick-form"><div class="field"><label>Goal name</label><input name="name" placeholder="e.g. Home deposit" required></div><div class="field"><label>Target amount</label><input name="target" type="number" min="1" required></div><div class="field"><label>Target date</label><input name="date" type="date"></div><button class="button" type="submit">Create goal</button></form><div class="goal-grid">${data.goals.map(g=>{const pct=Math.min(100,Math.round(g.saved/g.target*100));return `<article class="panel goal-card"><div class="goal-head"><span>${esc(g.name)}</span><span>Target ${esc(g.due||'date not set')}</span></div><div class="goal-pct">${pct}% saved</div><div class="progress"><i style="width:${pct}%"></i></div><small>${cash(g.saved)} of ${cash(g.target)}</small><br><button class="button secondary" data-contribute="${g.id}">Add ₹5,000</button></article>`}).join('')}</div>`;
        const render=()=>{const root=document.getElementById('root');root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><i class="brand-mark"></i><span class="brand-name">spend<span>wise</span></span></div><div class="workspace">YOUR MONEY SPACE</div><nav class="nav">${navItems.map(([id,ico,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span class="ico">${ico}</span><span>${label}</span></button>`).join('')}</nav><div class="side-bottom"><div class="demo-note"><b>Standalone demo</b>Your figures stay in this browser. No bank or account is connected.</div><button class="reset" data-reset>Reset demo data</button></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">YOUR FINANCIAL SPACE · ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()}</div><h1>${headerTitle[page]}</h1><p>Before you buy it, know what it will do to your finances.</p></div><span class="local-pill"><i></i>Local demo</span></header><div class="content">${page==='overview'?overview():page==='simulator'?simulator():page==='emi'?emi():page==='activity'?activity():goals()}<p class="disclaimer">Estimates use numbers you enter and do not verify bank balances. Demo entries are saved only in this browser.</p><footer class="footer"><span>© 2026 SpendWise Financial Technologies</span><span>Built for better financial decisions</span></footer></div></main></div>`;bind();};
        const bind=()=>{
          document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();page=b.dataset.page;render()}));
          const spatialStage=document.querySelector('.spatial-demo-stage');if(spatialStage){spatialStage.addEventListener('pointermove',e=>{const r=spatialStage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;spatialStage.parentElement.style.setProperty('--mx',`${x*100}%`);spatialStage.parentElement.style.setProperty('--my',`${y*100}%`);spatialStage.style.setProperty('--orb-x',`${(x-.5)*10}deg`);spatialStage.style.setProperty('--orb-y',`${(.5-y)*8}deg`)});spatialStage.addEventListener('pointerleave',()=>{spatialStage.parentElement.style.setProperty('--mx','50%');spatialStage.parentElement.style.setProperty('--my','50%');spatialStage.style.setProperty('--orb-x','0deg');spatialStage.style.setProperty('--orb-y','0deg')});spatialStage.querySelectorAll('.demo-signal').forEach(card=>{card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();card.style.setProperty('--tilt-x',`${((e.clientX-r.left)/r.width-.5)*5}deg`);card.style.setProperty('--tilt-y',`${(.5-(e.clientY-r.top)/r.height)*5}deg`)});card.addEventListener('pointerleave',()=>{card.style.setProperty('--tilt-x','0deg');card.style.setProperty('--tilt-y','0deg')})})}
          document.querySelector('[data-reset]')?.addEventListener('click',()=>{if(confirm('Reset all local demo entries and return to sample data?')){data=initial();save();page='overview';render()}});
          document.querySelectorAll('[data-contribute]').forEach(b=>b.addEventListener('click',()=>{const g=data.goals.find(x=>String(x.id)===b.dataset.contribute);if(g){g.saved=Math.min(g.target,g.saved+5000);save();render()}}));
          document.querySelectorAll('[data-delete-entry]').forEach(b=>b.addEventListener('click',()=>{data.entries=data.entries.filter(x=>String(x.id)!==b.dataset.deleteEntry);save();render()}));
          const sf=document.getElementById('sim-form');if(sf){const update=()=>{const x=Object.fromEntries(new FormData(sf));for(const k of ['price','balance','reserve','income','expenses','emi','credit','months'])x[k]=Number(x[k]||0);data.simDraft=x;document.getElementById('sim-result').innerHTML=purchaseResult(calcPurchase(x))};sf.addEventListener('input',update);sf.addEventListener('change',update);sf.addEventListener('submit',e=>{e.preventDefault();update();const r=calcPurchase(data.simDraft);data.simulations.unshift({id:Date.now(),product:data.simDraft.product,price:data.simDraft.price,score:r.score,status:r.status,date:today()});save();notify('Simulation saved to local history');render()})}
          const ef=document.getElementById('emi-form');if(ef){const update=()=>{const d=Object.fromEntries(new FormData(ef));for(const k of ['price','down','rate','months'])d[k]=Number(d[k]||0);data.emiDraft=d;const principal=Math.max(0,d.price-d.down),r=calcEmi(principal,d.rate,d.months);document.getElementById('emi-live').innerHTML=emiResult(r,principal)};ef.addEventListener('input',update);ef.addEventListener('change',update)}
          document.getElementById('plan-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),d=data.emiDraft||{price:180000,down:30000,rate:12.5,months:12},r=calcEmi(Math.max(0,d.price-d.down),d.rate,d.months);data.plans.unshift({id:Date.now(),label:f.get('label'),date:f.get('date'),months:d.months,payment:r.payment});save();notify('EMI plan saved');render()});
          document.getElementById('entry-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);data.entries.unshift({id:Date.now(),name:f.get('name'),category:f.get('category')||'Other',type:f.get('type'),amount:Number(f.get('amount')),date:f.get('date')||today()});save();render()});
          document.getElementById('budget-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=f.get('category').trim(),existing=data.budgets.find(x=>x.category.toLowerCase()===name.toLowerCase());if(existing)existing.limit=Number(f.get('limit'));else data.budgets.push({category:name,limit:Number(f.get('limit'))});save();render()});
          document.getElementById('goal-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);data.goals.unshift({id:Date.now(),name:f.get('name'),target:Number(f.get('target')),saved:0,due:f.get('date')||'date not set'});save();render()});
          document.getElementById('card-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),lastFour=String(f.get('lastFour')).replace(/\D/g,'').slice(0,4),limit=Number(f.get('limit')),outstanding=Number(f.get('outstanding'));if(lastFour.length!==4||outstanding>limit){notify('Check the card digits and balances');return}data.cards.unshift({name:f.get('name'),lastFour,limit,outstanding,due:f.get('due')});save();render()});
        };
        const notify=(msg)=>{const old=document.querySelector('.toast');old?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2200)};
        render();
      })();
    </script>
    <script type="module">if(location.protocol!=='file:')import('/src/main.jsx')</script>
  </body>
</html>
